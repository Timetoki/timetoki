.vm-img{ cursor:pointer; }
.vm-img.shake{ animation:vshake .45s ease !important; }
@keyframes vshake{ 0%,100%{transform:translate(0,0) rotate(0)} 20%{transform:translate(-4px,0) rotate(-3deg)}
  40%{transform:translate(4px,0) rotate(3deg)} 60%{transform:translate(-3px,0) rotate(-2deg)} 80%{transform:translate(3px,0) rotate(2deg)} }
.falling-coin{ position:fixed; top:-60px; width:42px; height:auto; z-index:9990; pointer-events:none;
  image-rendering:pixelated; animation:fall-through 2.2s linear forwards; }
@keyframes fall-through{ from{ transform:translateY(0) rotate(0) } to{ transform:translateY(118vh) rotate(40deg) } }
.falling-item{ position:fixed; top:-50px; width:42px; height:auto; z-index:9980; pointer-events:none;
  image-rendering:pixelated; animation:fall-bottom 1.5s cubic-bezier(.4,0,.7,1) forwards; }
@keyframes fall-bottom{ from{ transform:translateY(0) } to{ transform:translateY(100vh) } }
.piled-item{ position:fixed; bottom:0; width:42px; height:auto; z-index:9980; pointer-events:none; image-rendering:pixelated; }
</style>

<script>
(function(){
  var COIN='pictures/assets/c.gif';
  var floating=0;        // 天上飘落的硬币计数（同屏并发数，用于成就判定）
  var pile=[];           // 底部堆叠的商品图标
  function dropCoin(){
    floating++;
    if(window.Achievements){
      window.Achievements.bump('vendingCoins', 10, 'vending-broke');
      if(floating>=10) window.Achievements.unlock('vending-flood');
    }
    var img=document.createElement('img');
    img.src=COIN; img.className='falling-coin';
    img.style.left=(10+Math.random()*80)+'vw';
    document.body.appendChild(img);
    img.addEventListener('animationend',function(){ img.remove(); floating--; });
  }
  var vm=document.getElementById('vm');
  if(vm){ vm.style.cursor='pointer';
    vm.addEventListener('click',function(){
      vm.classList.remove('shake'); void vm.offsetWidth; vm.classList.add('shake');
      dropCoin();
    });
    vm.addEventListener('animationend',function(){ vm.classList.remove('shake');
    });
  }
  // 商品掉落并堆在底部
  function dropItem(icon, fromX){
    var img=document.createElement('img');
    img.src='icons/Pixel_Mart/'+icon; img.className='falling-item';
    var x=(fromX!=null?fromX:Math.random()*window.innerWidth);
    img.style.left=Math.max(4,Math.min(window.innerWidth-44,x))+'px';
    document.body.appendChild(img);
    img.addEventListener('animationend',function(){
      img.classList.remove('falling-item'); img.classList.add('piled-item');
      var bx=(fromX!=null?fromX:Math.random()*window.innerWidth);
      img.style.left=Math.max(4,Math.min(window.innerWidth-44,bx))+'px';
      img.style.bottom=(Math.random()*10)+'px';
      pile.push(img);
      while(pile.length>50){ var old=pile.shift(); old.remove(); }
    });
  }
  document.querySelectorAll('.vitem:not(.out)').forEach(function(btn){
    btn.addEventListener('click',function(e){
      var icon=btn.getAttribute('data-icon');
      dropItem(icon, e.clientX);
    });
  });
})();
</script>
